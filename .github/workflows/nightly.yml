name: nightly-refresh

on:
  schedule:
    # 08:05 UTC daily: after US evening games settle, before the next slates.
    - cron: "5 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data/parlaysports.db
          # Unique key per run; restore-keys falls back to the latest
          # database built from identical seed inputs + code.
          key: parlay-db-${{ hashFiles('data/seed/**', 'parlaysports/**', 'scripts/seed.py') }}-${{ github.run_id }}
          restore-keys: parlay-db-${{ hashFiles('data/seed/**', 'parlaysports/**', 'scripts/seed.py') }}-

      - name: Seed (cold start only)
        run: |
          mkdir -p data/ci
          if [ -f data/parlaysports.db ]; then
            echo "database restored from cache; skipping seed" | tee data/ci/seed.log
          else
            python3 scripts/seed.py 2>&1 | tee data/ci/seed.log
            echo "seeded $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Every step tees its own log into data/ci so a failure is diagnosable
      # from the repository itself (Actions log download is not available to
      # everyone, and a red run with no evidence is not acceptable).
      - name: Unit tests
        run: python3 -m unittest discover -s tests -q 2>&1 | tee data/ci/tests.log

      - name: Nightly collect + forward + settle + export
        run: python3 scripts/nightly.py 2>&1 | tee data/ci/nightly.log

      - name: Audit (PASS 2/3 gates)
        run: python3 scripts/audit.py 2>&1 | tee data/ci/audit.log

      - name: UI smoke (all routes render against real exports)
        run: node scripts/ui_smoke.mjs 2>&1 | tee data/ci/ui_smoke.log

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/parlaysports.db
          key: parlay-db-${{ hashFiles('data/seed/**', 'parlaysports/**', 'scripts/seed.py') }}-${{ github.run_id }}

      - name: Run summary
        if: always()
        run: |
          {
            echo "## nightly-refresh $(date -u +%FT%TZ)"
            echo ""
            echo "| stage | result |"
            echo "| --- | --- |"
            for f in seed tests nightly audit ui_smoke; do
              if [ -f "data/ci/$f.log" ]; then
                echo "| $f | $(tail -n 1 "data/ci/$f.log" | cut -c1-160) |"
              else
                echo "| $f | did not run |"
              fi
            done
            echo ""
            echo "<details><summary>audit failures</summary>"
            echo ""
            echo '```'
            grep -E '^\s*FAIL|^\[FAIL\]|-- failing checks --' data/ci/audit.log 2>/dev/null | head -n 40 || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs-${{ github.run_id }}
          path: |
            data/ci/*.log
            data/audit_report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit refreshed exports
        if: success()
        run: |
          git config user.name "parlaysports-bot"
          git config user.email "parlaysports-bot@users.noreply.github.com"
          git add data/site/*.json data/audit_report.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "nightly: refresh data exports ($(date -u +%F))"
            git push origin "${{ github.ref_name }}"
          fi

      # On failure the exports are NOT published (nothing unverified reaches
      # Pages), but the evidence is: logs, the audit report and the current
      # data-quality state are committed so the failure can be diagnosed and
      # the record shows what the run actually saw.
      - name: Commit failure diagnostics
        if: failure()
        run: |
          git config user.name "parlaysports-bot"
          git config user.email "parlaysports-bot@users.noreply.github.com"
          git checkout -B "${{ github.ref_name }}" 2>/dev/null || true
          git pull --ff-only origin "${{ github.ref_name }}" || true
          git add data/ci/*.log data/audit_report.json data/site/quality.json || true
          if git diff --cached --quiet; then
            echo "no diagnostics to commit"
          else
            git commit -m "ci: nightly failed on $(date -u +%F) - commit run logs + audit report

Exports were NOT published. See data/ci/*.log and data/audit_report.json for
the failing gates."
            git push origin "${{ github.ref_name }}"
          fi
